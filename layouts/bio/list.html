{{ partial "head.html" . }}
{{ partial "navbar.html" . }}
<div class="wrapper">
  <div class="container" id="main-container">
    <article class="article-content">
      <header class="page-header">
        <h1 class="title">{{ .Title }}</h1>
        {{ with .Params.description }}
        <p class="lead">{{ . }}</p>
        {{ end }}
        <hr />
      </header>
      
      <div class="row">
        <div class="col-sm-12">
          {{ .Content }}
        </div>
      </div>
    </article>
  </div>
</div>
{{ partial "footer.html" . }}
