<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.subtitle }}">
  <meta name="theme-color" content="#131715">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/custom.css" rel="stylesheet">
  {{ with .Site.Params.fonts }}<link href='https://fonts.googleapis.com/css?family={{ . }}' rel='stylesheet' type='text/css'>{{ end }}
  <script src="https://code.jquery.com/jquery-2.1.1.min.js" type="text/javascript"></script>
  <script src="/js/bootstrap.js" type="text/javascript"></script>
  <script src="/js/jquery.jplayer.min.js" type="text/javascript"></script>
  <script src="/js/stage.js" type="text/javascript"></script>
  {{ if (eq .IsPage true ) }}
    {{ if (eq .Type "song") }}
    <script src="/js/jquery.leadsheet.js" type="text/javascript"></script>
    <script type="text/javascript">
      $(document).ready( function() {
        var leadSheet = new LeadSheet();
        $(".leadsheet-lyrics").each(function (i, obj) {
          var lyrics = $(this).text().trim();
          leadSheet.parse(lyrics);
          $(this).html(leadSheet.emit());
        });
      });
    </script>
    {{ end }}
  {{ end }}
</head>
<body>
<a class="skip-link" href="#main-container">Skip to content</a>
<script src="/js/site.js" defer></script>
